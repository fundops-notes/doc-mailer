name: Build Windows exe
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        run: pip install -r requirements.txt pyinstaller pytest
      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build exe
        run: pyinstaller --onefile --noconsole --name LP_Tool src/lp_tool.py
      - name: Package
        shell: pwsh
        run: |
          $dir = "release_pkg"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item dist/LP_Tool.exe $dir/
          Copy-Item examples/lp_data.example.json $dir/
          Copy-Item docs/使用说明.txt $dir/
          Compress-Archive -Path $dir/* -DestinationPath doc-mailer_win64.zip
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: doc-mailer_win64.zip
